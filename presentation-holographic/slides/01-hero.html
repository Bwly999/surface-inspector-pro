<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style-shared.css">
    <style>
        .hero-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }
        .logo-box {
            width: 320px;
            height: 140px;
            margin-bottom: 60px;
            position: relative;
        }
        .logo-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 50%, var(--secondary) 100%);
            border-radius: 36px;
            transform: rotate(3deg);
            box-shadow: 0 25px 60px rgba(255, 133, 227, 0.25);
            opacity: 0.8;
            filter: blur(2px);
        }
        .logo-main {
            position: absolute;
            inset: 0;
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-1.5deg);
            overflow: hidden;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 1);
        }
        .title-main {
            font-size: 130px;
            font-weight: 800;
            line-height: 0.9;
            margin-bottom: 25px;
            letter-spacing: -0.04em;
        }
        .subtitle {
            font-size: 38px;
            font-weight: 500;
            color: #64748b;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .version-badge {
            margin-top: 40px;
            font-size: 22px;
            padding: 10px 35px;
            border-radius: 99px;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.2);
        }
    </style>
</head>
<body>
    <div class="slide-content">
        <div class="hero-container">
            <!-- Iridescent Logo -->
            <div class="logo-box animate-slide-up">
                <div class="logo-bg"></div>
                <div class="logo-main">
                    <svg width="100%" height="100%" viewBox="0 0 80 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 20H80" stroke="rgba(0, 0, 0, 0.03)" stroke-width="0.5" />
                        <path d="M5 30C15 25 25 35 40 20C55 5 65 25 75 20" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 3" opacity="0.3" />
                        <rect x="39" y="0" width="15" height="40" fill="var(--primary)" opacity="0.12">
                        </rect>
                        <path d="M5 30C15 25 25 35 40 20C55 5 65 25 75 20" stroke="url(#iridGrad)" stroke-width="3.5" />
                        <defs>
                            <linearGradient id="iridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ec4899" />
                                <stop offset="50%" stop-color="#8b5cf6" />
                                <stop offset="100%" stop-color="#06b6d4" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>

            <h1 class="title-main animate-slide-up" style="animation-delay: 0.2s;">
                SURFACE <br> <span class="gradient-text">INSPECTOR</span> PRO
            </h1>
            <p class="subtitle animate-slide-up" style="animation-delay: 0.4s;">
                精密视觉分析工具的演进
            </p>
            <div class="version-badge badge animate-fade" style="animation-delay: 0.6s;">
                Major Update v3.3
            </div>
        </div>

        <div class="slide-footer">
            <div class="mono">Project Overview & Vibe Coding Journey</div>
            <div class="mono">© 2026 Surface Inspector</div>
        </div>
    </div>
</body>
</html>
