<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Surface Inspector Pro - Vibe Coding Journey (Aurora Glassmorphism)</title>
<!--
  Surface Inspector Pro Presentation Aggregator
  Architecture: Multi-file slide deck
  Style: Aurora Glassmorphism (Frosted Glass & Dynamic Aurora Gradient)
-->

<script>
  window.DECK_MANIFEST = [
    { file: "slides/01-hero.html",           label: "Hero" },
    { file: "slides/02-overview-intro.html", label: "Part 1: Overview" },
    { file: "slides/03-features.html",       label: "Key Features" },
    { file: "slides/04-architecture.html",   label: "Technical Architecture" },
    { file: "slides/05-advantages.html",     label: "Project Advantages" },
    { file: "slides/06-journey-intro.html",  label: "Part 2: Vibe Coding Journey" },
    { file: "slides/07-phase-1-demo.html",   label: "Phase 1: The Spark (Demo)" },
    { file: "slides/08-crisis.html",         label: "The Crisis: Bottleneck" },
    { file: "slides/09-phase-2-scaling.html",label: "Phase 2: Scaling (AI Studio)" },
    { file: "slides/09b-why-harness.html",   label: "Why Harness Engineering?" },
    { file: "slides/11-phase-3-harness.html",label: "Phase 3: Harness (CLI)" },
    { file: "slides/12-conclusion.html",     label: "Future Vision" }
  ];

  window.DECK_WIDTH = 1920;
  window.DECK_HEIGHT = 1080;
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Share+Tech+Mono&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #06030c;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
  }
  
  /* Aurora Cosmic background for the host wrapper */
  body::before {
    content: "";
    position: absolute;
    top: -20%; left: -20%;
    width: 140%; height: 140%;
    background: 
        radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(0, 240, 255, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(255, 0, 127, 0.06) 0%, transparent 50%);
    filter: blur(80px);
    z-index: 0;
    animation: aurora-flow 25s ease infinite alternate;
  }

  @keyframes aurora-flow {
    0% { transform: translate3d(0, 0, 0) rotate(0deg); }
    100% { transform: translate3d(30px, 20px, 0) rotate(10deg); }
  }

  #stage {
    position: fixed;
    top: 50%; left: 50%;
    transform-origin: top left;
    background: #06030c;
    box-shadow: 
        0 50px 100px rgba(0,0,0,0.8), 
        0 0 80px rgba(139, 92, 246, 0.15);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.05);
    z-index: 10;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: transparent;
  }
  .counter {
    position: fixed;
    bottom: 32px;
    right: 32px;
    background: rgba(18, 12, 38, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #e2e8f0;
    padding: 10px 22px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.05em;
    font-family: 'Share Tech Mono', monospace;
    z-index: 100;
    user-select: none;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .counter:hover { 
    background: rgba(18, 12, 38, 0.8);
    border-color: rgba(0, 240, 255, 0.3);
    box-shadow: 0 15px 40px rgba(0, 240, 255, 0.15);
  }
  .counter .label { 
    color: #00f0ff; 
    margin-left: 12px; 
    font-weight: 400;
    text-transform: uppercase;
  }
  .nav-zone {
    position: fixed;
    top: 0; bottom: 0;
    width: 10%;
    cursor: pointer;
    z-index: 50;
  }
  .nav-zone.left  { left: 0; }
  .nav-zone.right { right: 0; }
  .nav-hint {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 60px; height: 60px;
    border-radius: 50px;
    background: rgba(18, 12, 38, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    opacity: 0;
    transition: all 0.3s;
    font-weight: 200;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .nav-zone.left  .nav-hint { left: 40px; }
  .nav-zone.right .nav-hint { right: 40px; }
  .nav-zone:hover .nav-hint { 
    opacity: 1; 
    border-color: rgba(0, 240, 255, 0.3);
    color: #00f0ff;
    box-shadow: 0 15px 40px rgba(0, 240, 255, 0.15);
  }

  /* Print Support */
  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { background: #06030c; overflow: visible; height: auto; }
    #stage { position: static; transform: none !important; box-shadow: none; border: 0; }
    .counter, .nav-zone { display: none !important; }
    .print-stack { display: block; }
    .print-stack iframe {
      width: 1920px;
      height: 1080px;
      page-break-after: always;
      display: block;
    }
  }
</style>
</head>
<body>

<div id="stage">
  <iframe id="frame" src="about:blank"></iframe>
</div>

<div class="nav-zone left"  id="navL"><div class="nav-hint">‹</div></div>
<div class="nav-zone right" id="navR"><div class="nav-hint">›</div></div>
<div class="counter" id="counter">1 / 12</div>

<div class="print-stack" id="printStack" style="display:none;"></div>

<script>
(function () {
  const W = window.DECK_WIDTH || 1920;
  const H = window.DECK_HEIGHT || 1080;
  const deck = window.DECK_MANIFEST || [];
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const counter = document.getElementById('counter');
  const printStack = document.getElementById('printStack');
  const storageKey = 'deck-index-surface-pro-aurora';
  let current = 0;

  stage.style.width  = W + 'px';
  stage.style.height = H + 'px';

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    const x = (window.innerWidth  - W * s) / 2;
    const y = (window.innerHeight - H * s) / 2;
    stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    stage.style.top = '0';
    stage.style.left = '0';
  }

  function show(idx) {
    if (idx < 0 || idx >= deck.length) return;
    current = idx;
    frame.src = deck[idx].file;
    counter.innerHTML = `${idx + 1} / ${deck.length} <span class="label">${deck[idx].label || ''}</span>`;
    try { localStorage.setItem(storageKey, String(idx)); } catch (_) {}
    if (location.hash !== '#' + (idx + 1)) {
      history.replaceState(null, '', '#' + (idx + 1));
    }
  }

  function next() { show(Math.min(current + 1, deck.length - 1)); }
  function prev() { show(Math.max(current - 1, 0)); }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
      case 'ArrowLeft':  case 'PageUp':              e.preventDefault(); prev(); break;
      case 'Home':                                    e.preventDefault(); show(0); break;
      case 'End':                                     e.preventDefault(); show(deck.length - 1); break;
      case 'p': case 'P':                             window.print(); break;
      default:
        if (e.key >= '1' && e.key <= '9') {
          const i = parseInt(e.key, 10) - 1;
          if (i < deck.length) { e.preventDefault(); show(i); }
        }
    }
  });

  document.getElementById('navL').addEventListener('click', prev);
  document.getElementById('navR').addEventListener('click', next);
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/^#(\d+)$/);
    if (m) show(parseInt(m[1], 10) - 1);
  });

  const hashMatch = location.hash.match(/^#(\d+)$/);
  if (hashMatch) current = Math.min(parseInt(hashMatch[1], 10) - 1, deck.length - 1);
  else try {
    const v = parseInt(localStorage.getItem(storageKey), 10);
    if (!isNaN(v) && v >= 0 && v < deck.length) current = v;
  } catch (_) {}
  fit();
  show(current);

  window.addEventListener('beforeprint', () => {
    printStack.innerHTML = '';
    deck.forEach(item => {
      const f = document.createElement('iframe');
      f.src = item.file;
      printStack.appendChild(f);
    });
    printStack.style.display = 'block';
    document.getElementById('stage').style.display = 'none';
  });
  window.addEventListener('afterprint', () => {
    printStack.innerHTML = '';
    printStack.style.display = 'none';
    document.getElementById('stage').style.display = '';
  });
})();
</script>

</body>
</html>
