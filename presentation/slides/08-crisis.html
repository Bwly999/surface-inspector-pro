<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style-shared.css">
    <style>
        .crisis-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        .warning-glow {
            font-size: 120px;
            color: #ff0055;
            text-shadow: 0 0 40px rgba(255, 0, 85, 0.4);
            margin-bottom: 40px;
        }
        .crisis-title {
            font-size: 80px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 20px;
        }
        .spaghetti-visual {
            width: 100%;
            height: 300px;
            margin: 40px 0;
            position: relative;
            background: rgba(255, 0, 85, 0.02);
            border-radius: 20px;
            overflow: hidden;
        }
        .chaos-line {
            position: absolute;
            stroke: #ff0055;
            stroke-width: 1;
            opacity: 0.2;
        }
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            width: 1200px;
            margin-top: 40px;
        }
        .metric-card {
            background: rgba(255, 0, 85, 0.05);
            border: 1px solid rgba(255, 0, 85, 0.2);
            padding: 24px;
            border-radius: 8px;
        }
        .metric-val {
            font-family: var(--mono);
            font-size: 32px;
            font-weight: 800;
            color: #ff0055;
            margin-bottom: 8px;
        }
        .metric-label {
            font-size: 14px;
            font-weight: 700;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
        }
        .alert-bar {
            background: #ff0055;
            color: #fff;
            padding: 10px 40px;
            font-weight: 900;
            font-size: 24px;
            transform: rotate(-2deg);
            margin-top: 60px;
            box-shadow: 0 10px 30px rgba(255, 0, 85, 0.4);
        }
    </style>
</head>
<body>
    <div class="slide-content" style="background-image: radial-gradient(rgba(255,0,85,0.05) 1px, transparent 1px);">
        <div class="crisis-layout">
            <div class="warning-glow animate-fade">⚠️</div>
            <h2 class="crisis-title animate-slide-up">临界点：<span style="color: #ff0055;">单文件的终局</span></h2>
            <p class="animate-slide-up" style="font-size: 32px; color: rgba(255,255,255,0.5); animation-delay: 0.1s;">
                当 "Vibe" 遇到规模，混沌便开始产生。
            </p>

            <div class="spaghetti-visual animate-fade" style="animation-delay: 0.3s;">
                <svg width="100%" height="100%">
                    <!-- Generate some random chaotic lines -->
                    <path d="M100,50 Q400,250 800,50 T1500,200" class="chaos-line" fill="none" />
                    <path d="M200,250 Q600,50 1200,250 T1800,100" class="chaos-line" fill="none" />
                    <path d="M50,150 Q900,300 1700,50" class="chaos-line" fill="none" />
                    <path d="M300,300 Q100,100 1900,280" class="chaos-line" fill="none" />
                    <text x="50%" y="50%" text-anchor="middle" font-family="var(--mono)" font-size="60" fill="#ff0055" font-weight="900" style="opacity: 0.8;">VIBE_ENTROPY_OVERLOAD</text>
                </svg>
            </div>

            <div class="metric-grid">
                <div class="metric-card animate-slide-up" style="animation-delay: 0.4s;">
                    <div class="metric-val">20+</div>
                    <div class="metric-label">Chat Turns</div>
                </div>
                <div class="metric-card animate-slide-up" style="animation-delay: 0.5s;">
                    <div class="metric-val">2500+</div>
                    <div class="metric-label">Lines of Code</div>
                </div>
                <div class="metric-card animate-slide-up" style="animation-delay: 0.6s;">
                    <div class="metric-val">1 : 3</div>
                    <div class="metric-label">Fix vs Bug Ratio</div>
                </div>
                <div class="metric-card animate-slide-up" style="animation-delay: 0.7s;">
                    <div class="metric-val">∞</div>
                    <div class="metric-label">Regression Chaos</div>
                </div>
            </div>

            <div class="alert-bar animate-slide-up" style="animation-delay: 0.9s;">
                亟需系统化代码拆分：从 "Demo" 进化为 "Engine"
            </div>
        </div>

        <div class="slide-footer">
            <div class="mono" style="color: #ff0055;">Critical Failure: The Single-File Bottleneck</div>
            <div class="mono">Slide 08 / 11</div>
        </div>
    </div>
</body>
</html>
