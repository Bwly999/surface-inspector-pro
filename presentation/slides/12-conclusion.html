<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style-shared.css">
    <style>
        .conclusion-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-bottom: 80px;
        }

        .synthesis-section {
            display: flex;
            flex-direction: column;
            gap: 40px;
            margin-bottom: 80px;
            width: 100%;
        }

        .golden-sentence {
            font-size: 42px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: #fff;
        }
        
        .golden-sentence .highlight {
            background: linear-gradient(135deg, var(--primary) 0%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .vision-section {
            opacity: 0.5;
            transition: opacity 0.5s;
            max-width: 900px;
        }
        .vision-section:hover { opacity: 1; }

        .future-title {
            font-family: var(--mono);
            font-size: 14px;
            color: var(--primary);
            letter-spacing: 0.5em;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .final-quote {
            font-size: 28px;
            font-weight: 500;
            line-height: 1.5;
            color: rgba(255,255,255,0.7);
        }
        .final-quote span { color: #fff; font-weight: 800; }

        .thanks-msg {
            position: absolute;
            bottom: 120px;
            opacity: 0.15;
            font-family: var(--mono);
            letter-spacing: 1em;
            font-size: 16px;
            pointer-events: none;
        }

        /* Ambient Glow Effect */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 77, 0, 0.05) 0%, transparent 70%);
            z-index: -1;
            filter: blur(50px);
        }
    </style>
</head>
<body>
    <div class="slide-content" style="padding: 0 100px;">
        <div class="ambient-glow animate-pulse"></div>

        <div class="conclusion-container">
            <div class="synthesis-section">
                <div class="golden-sentence animate-slide-up" style="animation-delay: 0.1s;">
                    <span class="highlight">想法是关键</span>，AI 驱动实现极致敏捷的 Demo
                </div>
                <div class="golden-sentence animate-slide-up" style="animation-delay: 0.2s;">
                    <span class="highlight">判断力愈发重要</span>，人做决策与规划，AI 做实现与验证
                </div>
                <div class="golden-sentence animate-slide-up" style="animation-delay: 0.3s;">
                    <span class="highlight">严谨性并未消失</span>，只是重新定位，从写代码转向设计环境
                </div>
            </div>

            <div class="vision-section animate-slide-up" style="animation-delay: 0.5s;">
                <div class="future-title">FUTURE VISION</div>
                <p class="final-quote">
                    从对话框中的 <span>Vibe</span> 开始，在本地工程的 <span>Harness</span> 中升华。<br>
                    将持续推动精密点云数据可视化工具的边界，构建 AI 原生的工业软件新范式。
                </p>
            </div>

            <div class="thanks-msg animate-fade" style="animation-delay: 0.8s;">
                THANKS FOR YOUR ATTENTION
            </div>
        </div>

        <div class="slide-footer" style="bottom: 40px;">
            <div class="mono">Defining the Future of AI Coding</div>
            <div class="mono">第 12 / 12 页</div>
        </div>
    </div>
</body>
</html>
