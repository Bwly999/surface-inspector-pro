<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style-shared.css">
    <style>
        .hero-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }
        .logo-box {
            width: 320px;
            height: 140px;
            margin-bottom: 60px;
            position: relative;
        }
        .logo-bg {
            position: absolute;
            inset: 0;
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.4);
            transform: rotate(2deg);
        }
        .logo-main {
            position: absolute;
            inset: 0;
            background: #111114;
            border: 2px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-1deg);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }
        .title-main {
            font-size: 130px;
            font-weight: 700;
            line-height: 0.9;
            margin-bottom: 25px;
            letter-spacing: 0.05em;
        }
        .subtitle {
            font-size: 36px;
            font-weight: 300;
            color: rgba(243, 243, 245, 0.5);
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }
        .version-badge {
            margin-top: 40px;
            font-size: 20px;
            padding: 10px 30px;
        }
    </style>
</head>
<body>
    <div class="slide-content">
        <div class="hero-container">
            <!-- Luxurious Metallic Logo -->
            <div class="logo-box animate-slide-up">
                <div class="logo-bg"></div>
                <div class="logo-main">
                    <svg width="100%" height="100%" viewBox="0 0 80 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 20H80" stroke="rgba(212, 175, 55, 0.15)" stroke-width="0.5" />
                        <path d="M5 30C15 25 25 35 40 20C55 5 65 25 75 20" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
                        <rect x="39" y="0" width="15" height="40" fill="var(--primary)" opacity="0.15">
                        </rect>
                        <path d="M5 30C15 25 25 35 40 20C55 5 65 25 75 20" stroke="var(--primary)" stroke-width="2" />
                    </svg>
                </div>
            </div>

            <h1 class="title-main animate-slide-up" style="animation-delay: 0.2s;">
                SURFACE <br> <span class="gradient-text">INSPECTOR</span> PRO
            </h1>
            <p class="subtitle animate-slide-up" style="animation-delay: 0.4s;">
                精密视觉分析工具的演进
            </p>
            <div class="version-badge badge animate-fade" style="animation-delay: 0.6s;">
                Major Update v3.3
            </div>
        </div>

        <div class="slide-footer">
            <div class="mono">Project Overview & Vibe Coding Journey</div>
            <div class="mono">© 2026 Surface Inspector</div>
        </div>
    </div>
</body>
</html>
