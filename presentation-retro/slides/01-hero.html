<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style-shared.css">
    <style>
        .hero-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .logo-box {
            width: 320px;
            height: 140px;
            margin-bottom: 60px;
            position: relative;
        }
        .logo-bg {
            position: absolute;
            inset: 0;
            background: transparent;
            border: 2px dashed var(--secondary);
            transform: rotate(2deg);
        }
        .logo-main {
            position: absolute;
            inset: 0;
            background: #030804;
            border: 2px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-1deg);
            overflow: hidden;
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.4);
        }
        .title-main {
            font-size: 110px;
            font-weight: 400;
            line-height: 0.9;
            margin-bottom: 20px;
            letter-spacing: 0.05em;
        }
        .subtitle {
            font-size: 32px;
            color: var(--secondary);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .version-badge {
            margin-top: 40px;
            font-size: 24px;
            padding: 10px 30px;
        }
    </style>
</head>
<body>
    <div class="slide-content">
        <div class="hero-container">
            <!-- Animated Logo -->
            <div class="logo-box animate-slide-up">
                <div class="logo-bg"></div>
                <div class="logo-main">
                    <svg width="100%" height="100%" viewBox="0 0 80 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 20H80" stroke="#33ff33" stroke-width="0.5" opacity="0.3"/>
                        <path d="M5 30C15 25 25 35 40 20C55 5 65 25 75 20" stroke="#ffb000" stroke-width="2" stroke-dasharray="2 2" />
                        <rect x="39" y="0" width="15" height="40" fill="#33ff33" opacity="0.2">
                        </rect>
                        <path d="M5 30C15 25 25 35 40 20C55 5 65 25 75 20" stroke="#33ff33" stroke-width="2" />
                    </svg>
                </div>
            </div>

            <h1 class="title-main animate-slide-up" style="animation-delay: 0.2s;">
                SURFACE <br> <span class="gradient-text">&lt;INSPECTOR&gt;</span> PRO
            </h1>
            <p class="subtitle animate-slide-up" style="animation-delay: 0.4s;">
                [ Precision Visual Analytics Evolution ]
            </p>
            <div class="version-badge badge animate-fade" style="animation-delay: 0.6s;">
                VER 3.3 // MAJOR RELEASE
            </div>
        </div>

        <div class="slide-footer">
            <div class="mono">Project Overview & Vibe Coding Journey</div>
            <div class="mono">© 2026 Surface Inspector</div>
        </div>
    </div>
</body>
</html>
